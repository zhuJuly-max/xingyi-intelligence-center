<main class="wrap"><section class="filters"><input id="q" type="search" placeholder="搜索企业、产品、型号、技术或新闻关键词"><select id="region"><option value="">全部区域</option><option>中国</option><option>国际</option><option>比利时 / 国际</option><option>荷兰 / 国际</option></select><select id="type"><option value="">全部业务类型</option><option>孵化设备</option><option>养殖设备</option><option>环控设备</option><option>孵化及自动化</option><option>养殖设备与EPC</option><option>家禽养殖设备及环控</option><option>禽业客户 / 技术应用标杆</option></select></section>

<section class="panel"><h2>监测范围与数据说明</h2><p id="watchCount" class="meta">监测企业清单载入中…</p><p class="meta">当前新闻监测使用Google News RSS聚合检索，采集标题、媒体、日期和链接；它不是官方新闻源监测，也不等于已确认的企业动态。需要进入原文复核后才能形成事实结论。</p></section>
</main><script>
const S={profiles:[],watch:[],news:[],view:"all"};const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function profileCard(x){return '<article class="card"><span class="pill">'+esc(x.region)+'</span><span class="pill">'+esc(x.type)+'</span><h3>'+esc(x.name)+'</h3><div class="meta">'+(x.website?'企业官网已登记':'官网链接待核')+'</div><p><b>产品系列：</b>'+esc(x.products||"公开产品信息待补充")+'</p><p><b>公开事实：</b>'+esc(x.verified_facts||"尚无足够可靠资料形成企业事实档案。")+'</p><p><b>技术观察：</b>'+esc(x.technology||"未找到可核实的公开技术参数。")+'</p><div class="source">'+(x.website?'<a href="'+esc(x.website)+'" target="_blank" rel="noopener noreferrer">企业官网 ↗</a>':'<span>官网待核</span>')+'<a href="'+esc(x.source_url||x.website||"#")+'" target="_blank" rel="noopener noreferrer">资料来源 ↗</a></div></article>'}
function newsCard(x){return '<article><h4><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></h4><p>'+esc(x.company)+' · '+esc(x.publisher)+' · '+esc((x.published_at||"").slice(0,10))+' · 待核实媒体线索</p></article>'}
function render(){const q=$("q").value.toLowerCase().trim(),r=$("region").value,t=$("type").value;if(S.view==="news"){let n=S.news.filter(x=>(!q||[x.company,x.title,x.publisher].join(" ").toLowerCase().includes(q))&&(!r||(r==="中国"?x.region==="CN":x.region==="INTL")));$("cards").innerHTML=n.length?'<section class="panel" style="grid-column:1/-1"><div class="news">'+n.slice(0,60).map(newsCard).join("")+'</div></section>':'<div class="empty">暂无匹配的新闻线索。</div>';return}let list=S.profiles.filter(x=>(S.view==="all"||(S.view==="cn"&&x.region.includes("中国"))||(S.view==="intl"&&!x.region.includes("中国")))&&(!r||x.region===r|| (r==="国际"&&x.region!=="中国"))&&(!t||x.type.includes(t)||t.includes(x.type))&&(!q||[x.name,x.region,x.type,x.products,x.verified_facts,x.technology].join(" ").toLowerCase().includes(q)));$("cards").innerHTML=list.length?list.map(profileCard).join(""):'<div class="empty">当前筛选没有匹配的已建档企业。未建档企业仍在监测清单中。</div>'}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;S.view=b.dataset.view;[...$("tabs").querySelectorAll("button")].forEach(x=>x.classList.toggle("active",x===b));render()});["q","region","type"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",render));
async function init(){try{const [p,n]=await Promise.all(["data/competitor-profiles.json","data/competitor-news.json"].map(u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));S.profiles=p.profiles||[];const profileDate=p.updated_at||"未注明",newsDate=(n.generated_at||"").slice(0,10)||"未注明";const age=newsDate==="未注明"?999:Math.floor((new Date().setHours(0,0,0,0)-new Date(newsDate+"T00:00:00").getTime())/86400000);const freshness=document.createElement("div");freshness.className="data-freshness "+(age>7?"fresh-old":age>3?"fresh-watch":"");freshness.innerHTML='<span><i class="fresh-dot"></i><strong>数据维护状态</strong> · 企业档案：'+esc(profileDate)+' · 媒体采集：'+esc(newsDate)+'</span><small>'+(age<=3?"近期采集":age<=7?"建议复核采集":"采集间隔较长，建议复核")+' · 媒体线索仍需核实</small>';$("watchCount").before(freshness);S.watch=p.watchlist||[];S.news=n.items||[];$("ckWatch").textContent=S.watch.length;$("ckProfiles").textContent=S.profiles.length;$("ckNews").textContent=S.news.length;$("ckIntl").textContent=S.profiles.filter(x=>!String(x.region||"").includes("中国")).length;$("watchCount").textContent="监测清单 "+S.watch.length+" 家；已建立来源档案 "+S.profiles.length+" 家；新闻线索 "+S.news.length+" 条。档案更新 "+p.updated_at+"；新闻采集 "+(n.generated_at||"未注明")+"。";render()}catch(e){$("cards").textContent="同行档案载入失败，请稍后重试。";$("watchCount").textContent=e.message}}
init();
</script></body></html>
