<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="兴仪全球禽业产业链情报中心：中国禽业主要品类行情与成本趋势。">
<title>中国行情成本｜兴仪全球禽业产业链情报中心</title>
<link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/editorial.css">
<style>
:root{--market-red:#c92720;--market-ink:#292626;--market-muted:#786e6b;--market-line:#eddfdc}
body.market-intelligence-page{background:#fff8f7;color:var(--market-ink)}
.market-intelligence-page .site-header{background:#fff}
.market-page{max-width:1180px;margin:0 auto;padding:38px 5% 60px}
.market-hero{padding:30px 34px;border:1px solid var(--market-line);border-radius:16px;background:linear-gradient(120deg,#fff 0%,#fff6f4 100%)}
.market-eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--market-red)}
.market-hero h1{font-size:clamp(28px,4vw,42px);margin:9px 0;color:var(--market-ink)}
.market-hero p{max-width:760px;margin:0;color:var(--market-muted);font-size:13px;line-height:1.8}
.market-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.market-meta span{padding:6px 10px;border:1px solid var(--market-line);border-radius:20px;background:#fff;color:#756a67;font-size:11px}
.market-latest{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0;padding:14px 18px;border:1px solid var(--market-line);border-radius:12px;background:#fff}
.market-latest-title{font-size:11px;font-weight:800;color:var(--market-muted);margin-right:auto}
.market-latest-item{display:flex;align-items:baseline;gap:8px}
.market-latest-item span{font-size:12px;color:var(--market-muted)}
.market-latest-item strong{font-size:21px;color:var(--market-red)}
.market-latest-item small{font-size:10px;color:#328264}
.market-latest-date{font-size:10px;color:var(--market-muted);white-space:nowrap}
.market-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.market-section-head h2{margin:0;color:#292626;font-size:22px}
.market-section-head p{margin:4px 0 0;color:var(--market-muted);font-size:11px}
.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.market-segment{padding:18px 20px;border:1px solid var(--market-line);border-radius:13px;background:#fff;min-width:0;box-shadow:0 5px 18px rgba(102,36,31,.035)}
.market-segment-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.market-segment h3{margin:0;color:#292626;font-size:17px}
.market-tag{padding:4px 8px;border-radius:20px;background:#fff1ef;color:#a9231e;font-size:10px;white-space:nowrap}
.market-value{display:flex;align-items:baseline;gap:8px;margin:13px 0 0}
.market-value strong{font-size:25px;color:var(--market-red)}
.market-value span{font-size:11px;color:var(--market-muted)}
.market-chart{width:100%;height:118px;display:block;margin-top:4px;overflow:visible}
.market-chart .gridline{stroke:#f0e7e5;stroke-width:1}
.market-chart .trend{fill:none;stroke:#c92720;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.market-chart .point{fill:#fff;stroke:#c92720;stroke-width:2.5}
.market-chart-labels{display:flex;justify-content:space-between;color:#9a8d89;font-size:10px;margin-top:-2px}
.market-footnote{margin:10px 0 0;padding-top:9px;border-top:1px solid #f2e9e7;color:#827673;font-size:10px;line-height:1.6}
.market-empty{height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:12px;border:1px dashed #e8d8d5;border-radius:9px;background:#fffaf9;color:#827673;text-align:center}
.market-empty strong{font-size:14px;color:#665c59;margin-bottom:5px}
.market-empty span{font-size:11px}
.market-source{margin-top:16px;padding:12px 15px;border-radius:10px;background:#fff4f1;color:#776b67;font-size:11px;line-height:1.8}
.market-source a{color:#b92721;font-weight:700}
.market-footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--market-line);color:#8b7e7a;font-size:11px}
@media(max-width:680px){.market-page{padding:24px 4% 40px}.market-hero{padding:23px 20px}.market-grid{grid-template-columns:1fr}.market-latest{gap:10px}.market-latest-title{width:100%}.market-latest-item strong{font-size:19px}.market-section-head h2{font-size:19px}}
</style>
</head>
<body class="market-intelligence-page">
<header class="site-header">
<a class="brand" href="index.html#home"><img class="brand-logo" src="assets/xingyi-logo.png" alt="兴仪 XingYi"><span class="brand-caption"><strong>全球禽业产业链情报中心</strong><small>GLOBAL POULTRY INDUSTRY INTELLIGENCE</small></span></a>
<nav><a href="index.html#home">首页</a><a class="active" href="markets.html">行情成本</a><a href="customers.html">客户洞察</a><a href="competitors.html">同行洞察</a><a href="exhibitions.html">展会信息</a><a href="regulations.html">法规准入</a></nav>
<div class="header-actions"><a class="contact-link" href="index.html#contact">联系兴仪 ↗</a></div>
</header>
<main class="market-page">
<section class="market-hero">
<div class="market-eyebrow">CHINA POULTRY MARKET MONITOR</div>
<h1>中国禽业行情与成本</h1>
<p>聚焦四大禽业品类价格走势。优先展示可核实的全国监测数据；品类专属数据暂缺时明确标注，不以其他品种价格代替。</p>
<div class="market-meta"><span>中国全国</span><span>人民币 CNY</span><span id="marketPeriod">周度价格趋势</span><span id="marketUpdated">数据更新中</span></div>
</section>
<section class="market-latest" aria-label="最新日度批发市场参考价">
<div class="market-latest-title">最新批发市场参考价</div>
<div id="dailyItems" style="display:contents"><span class="market-latest-date">数据读取中…</span></div>
<div class="market-latest-date" id="dailyDate"></div>
</section>
<div class="market-section-head"><div><h2>四大品类价格走势</h2><p>折线展示最近已发布的周度价格；横轴为采集日期。</p></div></div>
<section class="market-grid" id="segmentGrid" aria-live="polite">
<article class="market-segment">正在读取行情数据…</article>
</section>
<div class="market-source" id="marketSource">数据来源与统计口径读取中…</div>
<div class="market-footer">兴仪全球禽业产业链情报中心 · 行情成本栏目</div>
</main>
<script>
(async()=>{
 const fmt=n=>"¥"+new Intl.NumberFormat("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
 const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
 try{
  const response=await fetch("data/market-prices-cn.json",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const d=await response.json();
  document.getElementById("marketUpdated").textContent="周度数据截至 "+d.updated_at;
  const daily=document.getElementById("dailyItems");daily.replaceChildren();
  if(d.daily_snapshot){
   const snap=d.daily_snapshot;
   snap.items.forEach(item=>{
    const wrap=el("div","market-latest-item");
    wrap.append(el("span","",item.name),el("strong","",fmt(item.value)+" /公斤"),el("small","",((item.change_pct<0?"↓ ":item.change_pct>0?"↑ ":"→ ")+Math.abs(item.change_pct).toFixed(1)+"%")));
    daily.append(wrap);
   });
   document.getElementById("dailyDate").textContent="日度数据 "+snap.date;
  }else{daily.textContent="暂无日度批发参考价";}
  const series=Object.fromEntries(d.series.map(s=>[s.id,s]));
  const configs=[
   {title:"白羽肉鸡",id:"chicken_meat",tag:"全国鸡肉价格参考",note:"全国鸡肉综合均价，并非白羽肉鸡专属报价。"},
   {title:"白羽肉鸭",id:null,tag:"品种专属数据待补",note:"暂无可核实的同口径全国白羽肉鸭周度价格序列。"},
   {title:"蛋鸡",id:"eggs",tag:"全国鸡蛋价格",note:"全国500县集贸市场鸡蛋周度均价。"},
   {title:"小白鸡（817）",id:null,tag:"品种专属数据待补",note:"暂无可核实的817专属鸡苗、毛鸡或屠宰产品周度序列。"}
  ];
  const grid=document.getElementById("segmentGrid");grid.replaceChildren();
  configs.forEach(cfg=>{
   const card=el("article","market-segment");
   const top=el("div","market-segment-top");top.append(el("h3","",cfg.title),el("span","market-tag",cfg.tag));card.append(top);
   const s=cfg.id?series[cfg.id]:null;
   if(s&&Array.isArray(s.values)&&s.values.length){
    const last=s.values[s.values.length-1],first=s.values[0],delta=last-first,percent=first?delta/first*100:0;
    const value=el("div","market-value");value.append(el("strong","",fmt(last)),el("span","",s.unit+" · "+d.dates[d.dates.length-1]),el("span","",((delta>0?"↑ ":delta<0?"↓ ":"→ ")+Math.abs(percent).toFixed(2)+"% / 观察区间")));card.append(value);
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 600 130");svg.setAttribute("preserveAspectRatio","none");svg.setAttribute("class","market-chart");svg.setAttribute("role","img");svg.setAttribute("aria-label",cfg.title+"价格趋势折线图");
    [28,65,102].forEach(y=>{const line=document.createElementNS(svg.namespaceURI,"line");line.setAttribute("x1","8");line.setAttribute("x2","592");line.setAttribute("y1",y);line.setAttribute("y2",y);line.setAttribute("class","gridline");svg.append(line)});
    const min=Math.min(...s.values),max=Math.max(...s.values),range=max-min||Math.max(Math.abs(max)*.02,.01);
    const pts=s.values.map((v,i)=>({x:20+i*(560/Math.max(s.values.length-1,1)),y:100-((v-min)/range)*65,v}));
    const poly=document.createElementNS(svg.namespaceURI,"polyline");poly.setAttribute("class","trend");poly.setAttribute("points",pts.map(p=>p.x+","+p.y).join(" "));svg.append(poly);
    pts.forEach((p,i)=>{const c=document.createElementNS(svg.namespaceURI,"circle");c.setAttribute("class","point");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r","5");const title=document.createElementNS(svg.namespaceURI,"title");title.textContent=d.dates[i]+": "+fmt(p.v)+" "+s.unit;c.append(title);svg.append(c)});
    card.append(svg);
    const labels=el("div","market-chart-labels");labels.append(el("span","",d.dates[0]),el("span","",d.dates[d.dates.length-1]));card.append(labels);
   }else{
    const empty=el("div","market-empty");empty.append(el("strong","","暂无可展示的品种专属价格曲线"),el("span","",cfg.note));card.append(empty);
   }
   card.append(el("p","market-footnote",cfg.note));grid.append(card);
  });
  const source=document.getElementById("marketSource");
  source.replaceChildren(document.createTextNode("周度趋势来源："+d.source+"。统计口径："+d.scope+"。周度最新日期："+d.updated_at+"。日度批发参考价单独统计，不与周度集贸市场均价直接拼接比较。 "));
  const a=el("a","","查看农业农村部周度原始报告 ↗");a.href=d.source_url;a.target="_blank";a.rel="noopener noreferrer";source.append(a);
  if(d.daily_snapshot){source.append(document.createTextNode("；日度来源："));const da=el("a","","农业农村部批发市场日监测 ↗");da.href=d.daily_snapshot.source_url;da.target="_blank";da.rel="noopener noreferrer";source.append(da)}
 }catch(error){document.getElementById("segmentGrid").textContent="行情数据暂时无法加载，请稍后重试。";console.error(error)}
})();
</script>
</body></html>
