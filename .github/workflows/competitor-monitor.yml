name: Competitor intelligence update

on:
  schedule:
    # 07:30 China Standard Time (UTC+8) = 23:30 UTC on the previous day
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: competitor-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public competitor news
        run: python scripts/competitor_monitor.py
      - name: Commit updated intelligence archive
        run: |
          if git diff --quiet; then
            echo "No new competitor items."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitor-news.json
          git commit -m "Update competitor intelligence archive"
          git push
